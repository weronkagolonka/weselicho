name: Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-fronted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          cd ./rsvp-frontend
          npm ci

      - name: Bundle
        run: |
          cd ./rsvp-frontned
          npm run build
